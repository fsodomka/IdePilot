plugins {
    id 'java'
    id 'org.jetbrains.intellij.platform' version '2.19.0'
}

group = 'com.fsodomka.idepilot'
version = '2026.1.0'

repositories {
    mavenCentral()
    intellijPlatform {
        defaultRepositories()
    }
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
}

tasks.withType(JavaCompile).configureEach {
    options.release = 21
    options.compilerArgs.add("-Xlint:deprecation")
}

def platformLocalPath = providers.gradleProperty('platformLocalPath').filter { !it.isBlank() }

dependencies {
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.opentest4j:opentest4j:1.3.0'
    intellijPlatform {
        intellijIdea(providers.gradleProperty('platformVersion'))
        testFramework(org.jetbrains.intellij.platform.gradle.TestFrameworkType.Platform.INSTANCE)
    }
}

intellijPlatform {
    buildSearchableOptions = false
    instrumentCode = false
    pluginConfiguration.version = project.version.toString()
    pluginConfiguration.ideaVersion.sinceBuild = '252'
    pluginConfiguration.ideaVersion.untilBuild = provider { null }

    pluginVerification.ides.create('IU', providers.gradleProperty('platformVersion'))
    // the default minus INTERNAL_API_USAGES: IdeLog reads MessagePool, which has no public counterpart
    pluginVerification.failureLevel = [
            org.jetbrains.intellij.platform.gradle.tasks.VerifyPluginTask.FailureLevel.COMPATIBILITY_PROBLEMS,
            org.jetbrains.intellij.platform.gradle.tasks.VerifyPluginTask.FailureLevel.OVERRIDE_ONLY_API_USAGES,
    ]
    if (platformLocalPath.isPresent()) {
        pluginVerification.ides.local(platformLocalPath)
    }
}

// drives every tool once against an IDE already running the plugin, e.g. runIde; -PsmokeUrl=... for another port
tasks.register('smokeTest', Exec) {
    group = 'verification'
    description = 'Runs scripts/smoke.py against a running IDE with the plugin.'
    commandLine 'python', 'scripts/smoke.py', '--url', providers.gradleProperty('smokeUrl').getOrElse('http://127.0.0.1:63400/mcp')
    environment 'PYTHONUTF8', '1'
    def idePilotToken = providers.gradleProperty('idePilotToken')
    if (idePilotToken.isPresent()) {
        environment 'IDEPILOT_TOKEN', idePilotToken.get()
    }
}

tasks.withType(org.jetbrains.intellij.platform.gradle.tasks.RunIdeTask).configureEach {
    maxHeapSize = '4g'
    autoReload = false
    // the MCP token, from idePilotToken in ~/.gradle/gradle.properties; without it the plugin generates one
    def idePilotToken = providers.gradleProperty('idePilotToken')
    if (idePilotToken.isPresent()) {
        jvmArgs("-Didepilot.token=${idePilotToken.get()}")
    }
}

if (platformLocalPath.isPresent()) {
    intellijPlatformTesting {
        runIde {
            register('runIdeLocal') {
                localPath = file(platformLocalPath.get())
            }
        }
    }
}
