plugins {
    id 'java'
    id 'org.jetbrains.intellij.platform' version '2.19.0'
}

group = 'com.fsodomka.idepilot'
version = '2026.1.0'

repositories {
    mavenCentral()
    intellijPlatform {
        defaultRepositories()
    }
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
}

tasks.withType(JavaCompile).configureEach {
    options.release = 21
    options.compilerArgs.add("-Xlint:deprecation")
}

def platformLocalPath = providers.gradleProperty('platformLocalPath').filter { !it.isBlank() }

dependencies {
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.opentest4j:opentest4j:1.3.0'
    intellijPlatform {
        intellijIdea(providers.gradleProperty('platformVersion'))
        testFramework(org.jetbrains.intellij.platform.gradle.TestFrameworkType.Platform.INSTANCE)
    }
}

intellijPlatform {
    buildSearchableOptions = false
    instrumentCode = false
    pluginConfiguration.version = project.version.toString()
    pluginConfiguration.ideaVersion.sinceBuild = '242'
    pluginConfiguration.ideaVersion.untilBuild = provider { null }

    pluginVerification.ides.create('IU', providers.gradleProperty('platformVersion'))
    if (platformLocalPath.isPresent()) {
        pluginVerification.ides.local(platformLocalPath)
    }
}

tasks.withType(org.jetbrains.intellij.platform.gradle.tasks.RunIdeTask).configureEach {
    maxHeapSize = '4g'
    autoReload = false
    // the MCP token, from idePilotToken in ~/.gradle/gradle.properties; without it the plugin generates one
    def idePilotToken = providers.gradleProperty('idePilotToken')
    if (idePilotToken.isPresent()) {
        jvmArgs("-Didepilot.token=${idePilotToken.get()}")
    }
}

if (platformLocalPath.isPresent()) {
    intellijPlatformTesting {
        runIde {
            register('runIdeLocal') {
                localPath = file(platformLocalPath.get())
            }
        }
    }
}
